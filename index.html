<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy</title>
    <style>
        .head{
            border: 2px solid black;
            border-radius: 100%;
            width: 300px;
            height:300px;
            background-color: brown;
            position: fixed;
            z-index: 111;
        }
        .pic{
            margin-top: 200px;
            margin-left: 400px;
        }
        .left-ear{
            border: 2px solid black;
            border-radius: 100%;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 220px;
            left:390px;
            background-color: brown;
            
        }
        .right-ear{
            border: 2px solid black;
            border-radius: 100%;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 220px;
            right:800px;
            border-left-color:brown ;
            border-bottom-color: brown;
            background-color: brown;
        }
        .left-eye{
            border: 2px solid black;
            border-radius: 100%;
            width: 25px;
            height: 25px;
            position: absolute;
            top: 270px;
            left: 480px;
            background-color: black;
            z-index: 111;

        }
        .right-eye{
            border: 2px solid black;
            border-radius: 100%;
            width: 25px;
            height: 25px;
            position: absolute;
            top: 270px;
            left: 600px;
            background-color: black;
            z-index: 111;
        }
        .nose-section{
            border: 2px solid black;
            border-radius: 100%;
            width: 120px;
            height: 110px;
            position: absolute;
            top: 380px;
            left: 500px;
           z-index: 111;
            background-color: black;
            
        }
        .nose{
            border: 2px solid black;
            border-radius: 100%;
            width: 60px;
            height: 40px;
            position: absolute;
            top: 420px;
            left: 530px;
            background-color: rgb(45, 43, 43);
            z-index: 111;
        }
    </style>
</head>
<body>
    <div class="pic">
        <div class="head"></div>
        <div class="left-ear"></div>
        <div class="right-ear"></div>
        <div class="left-eye"></div>
        <div class="right-eye"></div>
        <div class="nose-section"></div>
        <div class="nose"></div>
    </div>
</body>
</html>
